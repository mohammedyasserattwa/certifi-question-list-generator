version: '3.8'

services:
  api:
    build: .
    container_name: certifi-scraper-api
    ports:
      - "8000:8000"
    environment:
      - DEBUG=False
      - HOST=0.0.0.0
      - PORT=8000
      - WORKERS=4
      - LOG_LEVEL=INFO
      - ENABLE_IMAGE_DOWNLOAD=True
      - DOWNLOAD_DELAY=0.5
      - REQUEST_TIMEOUT=15
      - IMAGE_DOWNLOAD_TIMEOUT=15
    volumes:
      - ./images:/app/images
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
